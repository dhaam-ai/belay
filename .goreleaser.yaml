# GoReleaser configuration for belay
# This file handles multi-architecture binary builds, checksums, and changelog generation.
#
# IMPORTANT: The module path (github.com/dhaam-ai/belay) is a PLACEHOLDER.
# If you rename the module using `make rename-module OWNER=<handle>`, you MUST
# update the ldflags paths below in the build section to match the new module path.
# Search for "github.com/dhaam-ai/belay/internal/cli" and update all three occurrences:
# - Version path
# - Commit path
# - BuildDate path
#
# The placeholder is deliberate — the real GitHub owner is undecided. Do not hard-code
# an owner here that would silently break after a rename.

version: 2

project_name: belay

# Build configuration
builds:
  - id: belay
    main: ./cmd/belay
    binary: belay

    # Target platforms: darwin and linux, amd64 and arm64
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

    # Disable Windows — the project uses unix-only build tags.
    # See internal/exec, internal/linter, internal/runner (//go:build unix).
    # A Windows binary would fail at runtime on any command that shells out to
    # go/node/pytest/golangci-lint/docker, making it nearly useless.

    # Static builds: CGO_ENABLED=0 for portability
    env:
      - CGO_ENABLED=0

    # Version, commit, and build date injected via ldflags.
    # These paths MUST match internal/cli package.
    # If you rename the module, update these three paths:
    ldflags:
      - -X github.com/dhaam-ai/belay/internal/cli.Version={{.Version}}
      - -X github.com/dhaam-ai/belay/internal/cli.Commit={{.Commit}}
      - -X github.com/dhaam-ai/belay/internal/cli.BuildDate={{.CommitDate}}

    # Reproducible builds: use module timestamp for deterministic builds
    mod_timestamp: "{{ .CommitTimestamp }}"

# Checksums for all artifacts
checksum:
  name_template: "checksums.txt"

# Changelog grouped by conventional commit type
changelog:
  sort: asc

  # Map commit types to changelog sections
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 100

    - title: Bug Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 200

    - title: Refactoring
      regexp: '^refactor(\(.+\))?!?:'
      order: 300

    - title: Documentation
      regexp: '^docs(\(.+\))?!?:'
      order: 400

    - title: Testing
      regexp: '^test(\(.+\))?!?:'
      order: 500

    - title: Chores & Dependencies
      regexp: '^chore(\(.+\))?!?:'
      order: 600

    - title: Other Changes
      order: 999

  # Filter out conventional-commit footers and merge commits
  filters:
    exclude:
      - '^Merge pull request'
      - '^Merge branch'
      - '^bump:'

# Release configuration
release:
  github:
    owner: belay-dev  # This is a PLACEHOLDER — change it when renaming the module
    repo: belay
  mode: replace

# Archive configuration
archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

    # Include license and other useful files
    files:
      - LICENSE
      - README.md

# Homebrew tap.
#
# The tap repository must already exist and be public before the first release:
# goreleaser pushes a formula into it, it does not create it. See
# docs/releasing.md. A release that publishes binaries and then fails to update
# the tap leaves users a version they cannot install, which is worse than a
# release that refuses to start.
brews:
  - name: belay
    repository:
      owner: dhaam-ai
      name: homebrew-belay
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/dhaam-ai/belay"
    description: "Durable, resumable orchestrator for autonomous coding agents"
    license: "Apache-2.0"
    # belay drives whatever toolchain the target repository uses, so it cannot
    # declare those as dependencies -- a Go user should not be made to install
    # node. The one thing it always needs is an agent CLI, which Homebrew does
    # not package; the caveat says so rather than letting the first run fail
    # with a missing-toolchain error the user has no context for.
    dependencies: []
    caveats: |
      belay needs an agent CLI to do any work. Install Claude Code and sign in:

        https://claude.com/product/claude-code

      Then, in a repository you want it to work on:

        belay --dry-run run "add tests for the config parser"

      The dry run creates nothing and spends nothing. Drop --dry-run to start.
      belay stops at the plan for you to read before it writes any code.
    test: |
      assert_match "belay version", shell_output("#{bin}/belay version")
    # skip_upload keeps a snapshot build from pushing to the tap.
    skip_upload: auto
