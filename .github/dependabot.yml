version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 3
    reviewers:
      - belay-dev/maintainers
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
      include: "scope"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 3
    reviewers:
      - belay-dev/maintainers
    labels:
      - dependencies
      - automated
      - ci-cd
    commit-message:
      prefix: "ci:"
      include: "scope"
