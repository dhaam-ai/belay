name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@e2f20987646fbe3b7d0e1476191a133a37105c14 # v4.1.7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad66e883b2c33b2b446b4e3fe4c55381 # v4.0.1
        with:
          go-version: '1.26.3'
          cache: true

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        # Runs default suite; conformance is included via //go:build unix on unix runners
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage artifact
        uses: actions/upload-artifact@c7d193f32edcadf64c705ce4f91bc1cf9b8527ce # v4.0.1
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 5

  fixrate:
    name: Fix-Rate Harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@e2f20987646fbe3b7d0e1476191a133a37105c14 # v4.1.7

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad66e883b2c33b2b446b4e3fe4c55381 # v4.0.1
        with:
          go-version: '1.26.3'
          cache: true

      - name: Run fix-rate harness
        # Validates that the fix-rate measurement harness itself is sound.
        run: go test ./test/fixrate/... -tags=fixrate -race

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@e2f20987646fbe3b7d0e1476191a133a37105c14 # v4.1.7

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad66e883b2c33b2b446b4e3fe4c55381 # v4.0.1
        with:
          go-version: '1.26.3'
          cache: true

      - name: Run e2e tests
        # E2E test directory may not exist if siblings are still writing it.
        # Use || true to skip gracefully if the directory doesn't exist yet.
        run: |
          if [ -d ./test/e2e ]; then
            go test ./test/e2e/... -tags=e2e -race
          else
            echo "e2e test directory not found; skipping gracefully"
          fi

  fixture-seeded-bug:
    name: "Verify fixture: seeded-bug"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@e2f20987646fbe3b7d0e1476191a133a37105c14 # v4.1.7

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad66e883b2c33b2b446b4e3fe4c55381 # v4.0.1
        with:
          go-version: '1.26.3'
          cache: true

      - name: Verify the seeded-bug catalogue
        # This is the baseline the fix-rate measurement rests on, so it runs
        # in full -- including the injector's own check that every catalogued
        # defect still behaves as documented. That check was briefly excluded
        # here as "flaky"; it was not. B20 failed every time because it kills
        # the test binary outright ("fatal error: concurrent map writes"), so
        # test2json emitted no fail event and the verifier read a crash as
        # "the defect did nothing". Excluding it would have let the catalogue
        # rot silently underneath every fix-rate number belay publishes.
        run: |
          cd fixtures/seeded-bug
          go test ./... -race

  fixture-wc:
    name: "Verify fixture: wc"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@e2f20987646fbe3b7d0e1476191a133a37105c14 # v4.1.7

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad66e883b2c33b2b446b4e3fe4c55381 # v4.0.1
        with:
          go-version: '1.26.3'
          cache: true

      - name: Verify wc fixture compiles
        # wc is a deliberately-unimplemented demo target. It must compile
        # (so belay's loop can exercise test → fix), but will fail tests.
        # Failing is expected; a compile error means the skeleton broke.
        run: |
          cd fixtures/wc
          go build .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@e2f20987646fbe3b7d0e1476191a133a37105c14 # v4.1.7

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad66e883b2c33b2b446b4e3fe4c55381 # v4.0.1
        with:
          go-version: '1.26.3'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@08e9c4ff2ed1108e85f62f6fe0b3b15e1c37df3c # v3.7.0
        with:
          version: v2.12.2
          args: --timeout=5m

  tidy-check:
    name: Go Mod Tidy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@e2f20987646fbe3b7d0e1476191a133a37105c14 # v4.1.7

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad66e883b2c33b2b446b4e3fe4c55381 # v4.0.1
        with:
          go-version: '1.26.3'
          cache: false

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  verify-boundary:
    name: Verify Public API Boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@e2f20987646fbe3b7d0e1476191a133a37105c14 # v4.1.7

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad66e883b2c33b2b446b4e3fe4c55381 # v4.0.1
        with:
          go-version: '1.26.3'
          cache: true

      - name: Run boundary test
        # Must name the test exactly: `-run Boundary` matches nothing, so the job
        # would pass while running zero tests. No continue-on-error either — this
        # guard is the only thing enforcing that pkg/belay stays free of internal/.
        run: go test ./pkg/belay/... -run TestNoInternalImports -v

  zero-token-guard:
    name: Zero Token Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@e2f20987646fbe3b7d0e1476191a133a37105c14 # v4.1.7

      - name: Assert no workflow injects agent credentials
        # Match only real credential *injection* — an `env:`/`with:` binding or a
        # `secrets.` reference — not prose. A bare grep for the variable name
        # matches this very step and can never pass.
        run: |
          if grep -rnE '(env|with):|secrets\.' .github/workflows/ \
               | grep -E 'ANTHROPIC_API_KEY|CLAUDE_API_KEY|OPENAI_API_KEY'; then
            echo "ERROR: a workflow injects agent credentials into the build."
            echo "CI must never make live agent calls — every run costs real money."
            exit 1
          fi
          echo "OK: no workflow injects agent credentials."

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad66e883b2c33b2b446b4e3fe4c55381 # v4.0.1
        with:
          go-version: '1.26.3'
          cache: true

      - name: Assert no test reaches live agent at runtime
        # Even if code tries to use the agent API, the key must not be available.
        # All agent interactions must use the replay/cassette layer, not live calls.
        # Run a representative subset of tests with the API key explicitly unset.
        run: |
          # Explicitly unset all potential agent credentials
          unset ANTHROPIC_API_KEY CLAUDE_API_KEY OPENAI_API_KEY

          # Run a few representative test suites to verify they work without credentials
          # If any test tries to reach a live agent, it will fail with auth errors.
          echo "Testing internal/agent/replay (cassette/replay layer)..."
          go test ./internal/agent/replay/... -race

          echo "Testing internal/agent/claude (stub implementation)..."
          go test ./internal/agent/claude/... -race

          echo "Testing internal/cli with replay cassettes..."
          go test ./internal/cli/... -race -run TestExecute

          echo "OK: no test reached a live agent (would have failed without credentials)"
