[project]
name = "pyproject-fixture"
version = "0.1.0"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
